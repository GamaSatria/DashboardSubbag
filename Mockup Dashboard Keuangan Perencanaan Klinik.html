<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Dashboard Keuangan, Perencanaan &amp; Klinik · v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async onload="if(typeof rerender==='function') rerender()"></script>
<style>
:root{
  --ink:#111C2A; --ink2:#2B3847; --mute:#45546A; --line:#CBD4DF; --line2:#DFE5EC; --field:#7F8C9E; --bg:#EEF1F5; --card:#FFFFFF;
  --acc:#0E2A47; --accD:#0A1F35; --accT:#E8EEF5;
  --ok-bg:#DCF2E3; --ok:#14532D; --warn-bg:#FDEBCF; --warn:#7A3A05; --bad-bg:#FADCDC; --bad:#8F1414; --info-bg:#DBE7FA; --info:#173E86; --mute-bg:#E2E7EE; --mute-fg:#2B3847;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55}
a{color:var(--acc)} a:hover{color:var(--accD)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F2A33A;outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:28px 32px 64px}

/* header bagian */
.bhead{background:#fff}
.bhead .strip{height:6px;background:var(--acc)}
.bhead .in{max-width:1320px;margin:0 auto;padding:12px 32px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bid{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border:1.5px solid var(--field);border-radius:8px;color:var(--ink);font-size:16px;font-weight:700;text-decoration:none;background:#fff}
.back:hover{background:var(--accT);color:var(--ink)}
.mark{width:46px;height:46px;border-radius:10px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.bname{font-size:22px;font-weight:800;line-height:1.2}
.bsub{font-size:14px;color:var(--mute)}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rolebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rolebox label{font-size:15px;font-weight:700;color:var(--ink2)}
.rolebox select{min-height:46px;max-width:300px;border:1.5px solid var(--field);border-radius:8px;padding:0 10px;background:#fff;color:var(--ink);font-size:16px;font-weight:700}

/* menu utama: selalu terlihat saat halaman digulir */
.navbar{background:#fff;border-top:1px solid var(--line2);border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:20}
.menu{max-width:1320px;margin:0 auto;padding:6px 32px 0;display:flex;flex-wrap:wrap;gap:4px}
.menu a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;white-space:nowrap;font-size:16px;font-weight:700;color:var(--ink);border-radius:8px 8px 0 0;text-decoration:none}
.menu a:hover{background:var(--accT);color:var(--accD)}
.menu a.on,.menu a.on:hover{background:var(--acc);color:#fff}
.menu a.adm{margin-left:auto}
.admin-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:var(--accD);color:#fff;font-size:13px;font-weight:800;line-height:1.3;white-space:nowrap}
.menu a.on .admin-chip{background:#fff;color:var(--accD)}

/* penanda peran: siapa yang sedang masuk dan apa yang bisa dilakukan */
.roleband{color:#fff}
.roleband .in{max-width:1320px;margin:0 auto;padding:7px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;min-height:54px}
.roleband .who{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.roleband .ket{font-size:15px}
.roleband .btn{margin-left:auto;background:#fff;border-color:#fff;color:var(--ink);min-height:42px}
.roleband .btn:hover{background:#EEF1F5;border-color:#EEF1F5;color:var(--ink)}

/* page heading */
.ph{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:22px}
.ph h1{margin:0;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.ph .crumb{font-size:15px;color:var(--mute);font-weight:600;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo{padding:5px 12px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:700;white-space:nowrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.yearbox{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink2)}
.yearbox select{min-height:46px;min-width:104px;border:1.5px solid var(--field);border-radius:8px;padding:0 10px;background:#fff;font-size:16px;font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:8px;border:1.5px solid var(--field);background:#fff;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--accT);border-color:var(--acc);color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--accD);border-color:var(--accD);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.edit{border-color:var(--acc);color:var(--accD)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;box-shadow:0 1px 2px rgba(17,28,42,.05)}
.card h2,.sec h2{margin:0 0 14px;font-size:20px;font-weight:800;line-height:1.3}
.card .hint{font-size:14px;color:var(--mute)}
a.card:hover{border-color:var(--acc)}
.sec{margin-top:28px}
.kpi .l{font-size:15px;color:var(--ink2);font-weight:700}
.kpi .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 2px;line-height:1.2}
.kpi .n{font-size:14px;color:var(--mute)}
.cardhead,.dshead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.dshead{margin-bottom:16px}
.dshead h2{margin:0}
.dsrow{display:flex;justify-content:space-between;gap:8px;font-size:17px;margin-bottom:6px}
.dsfinal{font-size:38px;font-weight:800;line-height:1.1;margin-bottom:12px}

/* kartu IKK */
.ikk{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.ikk .tag{align-self:flex-start;background:var(--accT);color:var(--accD);font-size:15px}
.ikkdesc{flex:1;font-size:15px;line-height:1.5;color:var(--ink2)}
.ikkval{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line2);padding-top:12px}
.ikkval span{font-size:15px;font-weight:700;color:var(--ink2)}
.ikkval b{font-size:26px;font-weight:800;color:var(--accD);line-height:1.2}
.ikkmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;color:var(--mute)}
.ikkmeta b{display:block;color:var(--ink);font-size:15px}
.ikkmore{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--accD)}

/* panel admin tim kerja / urusan */
.upanel{background:var(--ut);border:2px solid var(--uc);border-radius:12px;padding:18px 22px;margin-bottom:22px}
.uphead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.uphead h2{margin:0;font-size:22px;font-weight:800;line-height:1.25}
.uplbl{font-size:15px;font-weight:700;color:var(--ink2)}
.upstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.upstats>div{background:#fff;border-radius:8px;padding:12px 16px}
.upstats span{display:block;font-size:15px;color:var(--ink2);font-weight:600}
.upstats b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.upstats .is-bad b{color:var(--bad)}

/* area penyajian form */
.formbox{padding:0;overflow:hidden}
.formhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:20px 24px;background:var(--accT);border-bottom:1px solid var(--line)}
.formhead h2{margin:0 0 2px}
.gform{display:flex;flex-direction:column;gap:18px;padding:24px;max-width:760px}
.wajib{color:var(--bad);font-weight:800}
.formframe{display:block;width:100%;height:780px;border:0;background:#fff}
.howto{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}

.alert{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:10px;font-size:16px;border:1.5px solid}
.alert.bad{background:var(--bad-bg);color:#6E1010;border-color:#E49C9C}
.alert.warn{background:var(--warn-bg);color:#663004;border-color:#E2B36E}
.alert.info{background:var(--info-bg);color:#123270;border-color:#A6C1EA}
.alert a{color:inherit;font-weight:800}

.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--info-bg);color:var(--info)} .mu{background:var(--mute-bg);color:var(--mute-fg)}

.tbox{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{background:#E7ECF2;color:var(--ink);text-align:left;padding:12px 14px;font-size:14px;font-weight:800;white-space:nowrap}
table.t td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t tr.sub td{background:#F1F4F8;font-weight:800}
table.t tr.tot td{background:#E2E8EF;font-weight:800;border-top:2px solid var(--field)}
table.t .pill{white-space:normal;border-radius:12px;line-height:1.3}
.sm{font-size:14px;color:var(--mute)}
.bar{display:block;height:12px;background:#DBE1E9;border-radius:6px;position:relative;min-width:70px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.barcell{display:flex;align-items:center;gap:8px}
.barcell b{width:64px;text-align:right;font-variant-numeric:tabular-nums}

.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700;color:var(--ink2)}
.f input,.f select,.f textarea{min-height:46px;border:1.5px solid var(--field);border-radius:8px;padding:0 12px;background:#fff;font-size:16px;font-weight:500;color:var(--ink)}
.f textarea{padding:10px 12px;min-height:90px}
.drop{border:2px dashed var(--field);border-radius:10px;padding:22px 16px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:center;background:#FBFCFD}

.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:14px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* portal */
.hero{background:#0E2A47;color:#fff}
.hero .in{max-width:1320px;margin:0 auto;padding:24px 32px 44px}
.pcard{display:flex;flex-direction:column;gap:12px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
.pcard:hover{border-color:var(--acc);box-shadow:0 4px 16px rgba(20,32,46,.08)}
.chip{padding:4px 11px;border-radius:999px;font-size:14px;font-weight:700}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(14,26,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:24px 26px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.modal h3{margin:0;font-size:20px;line-height:1.3}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111C2A;color:#fff;padding:14px 20px;border-radius:10px;font-size:16px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hide{display:none!important}
.note{font-size:15px;color:var(--ink2);background:#fff;border:1.5px dashed var(--field);border-radius:10px;padding:14px 18px}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.step{flex:1 1 170px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.step .k{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.step .k i{width:28px;height:28px;border-radius:14px;color:#fff;font-style:normal;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;padding:0 14px;border-radius:8px;border:1.5px solid var(--field);background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button:hover{background:var(--accT);border-color:var(--acc)}
.seg button.on,.seg button.on:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;padding:5px;background:#DCE2EA;border-radius:10px;width:fit-content;max-width:100%}
.tabs button{border:none;background:none;padding:0 18px;min-height:44px;display:inline-flex;align-items:center;font-weight:700;font-size:16px;color:var(--ink);border-radius:7px;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:#fff}
.tabs button.on,.tabs button.on:hover{background:var(--acc);color:#fff}
.dlnav{display:flex;flex-direction:column;gap:2px}
.dlnav button{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:none;background:none;border-radius:8px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.dlnav button:hover{background:var(--accT)}
.dlnav button b{font-size:14px;color:var(--mute);font-weight:800}
.dlnav button.on,.dlnav button.on:hover{background:var(--acc);color:#fff}
.dlnav button.on b{color:#fff}
.ficon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.tbx{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--field);border-radius:10px;background:#fff;font-size:16px;text-align:center}
.tbx span{font-size:14px;color:var(--mute)}
.tbx.dark{background:var(--acc);border-color:var(--acc);color:#fff}
.tbx.dark span{color:#fff}
.casc{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.crow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.crow>.tbx{min-width:260px}
.cside{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2);border:1.5px dashed var(--field);border-radius:10px;padding:10px 12px;max-width:400px}
.cline{width:2px;height:22px;background:var(--field);margin:0 auto}
.csplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;width:100%;max-width:840px;border-top:2px solid var(--field);padding-top:20px}
.ccol{display:flex;flex-direction:column;gap:8px}
.ptree{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:20px}
.pcol{display:flex;flex-direction:column;gap:12px}
.psplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.psplit>div{display:flex;flex-direction:column;gap:8px}
.tleaf{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FBFCFD;font-size:15px}
.tprog{font-size:14px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 6px}

/* kalender */
.cal2{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:760px}
.cal2h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#E7ECF2;border-bottom:1px solid var(--line)}
.cal2h .dh{padding:9px 10px;font-size:14px;font-weight:800;color:var(--ink)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:3px;border-top:1px solid var(--line)}
.cal2h + .wk{border-top:none}
.wd{border-left:1px solid var(--line);padding:5px 6px}
.wd:first-child{border-left:none}
.wd.out{background:#F4F6F9}.wd.out .dn,.wd.out .dnb{color:#6A788B}
.wd .dn{font-size:15px;font-weight:700;color:var(--ink);display:inline-block}
.wd.today .dn{background:var(--acc);color:#fff;border-radius:10px;padding:0 8px}
.wd .dnb{border:none;background:none;cursor:pointer;padding:0 8px;border-radius:10px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);min-height:24px}
.wd .dnb:hover{background:var(--accT);color:var(--accD)}
.wd.today .dnb{background:var(--acc);color:#fff}
.ev2{z-index:1;margin:0 5px;border:none;border-radius:6px;padding:3px 9px;font:inherit;font-size:13px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.4;align-self:center}
.ev2.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.ev2.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.ev2 .rng{font-weight:600;margin-left:6px}

/* klinik: kontrol stok dan popup */
.kstep{display:flex;align-items:center;gap:6px}
.kbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:1.5px solid var(--field);border-radius:8px;background:#fff;color:var(--ink);font-size:20px;font-weight:700;line-height:1;cursor:pointer}
.kbtn:hover{background:var(--accT);border-color:var(--acc)}
.kbtn[disabled]{opacity:.4;cursor:not-allowed}
.kseg button{flex:1 1 0}
.kprev{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:12px 14px;border-radius:10px;background:var(--accT);color:var(--ink);font-size:15px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:8px;align-items:center}
.krow select,.krow input{width:100%;min-width:0;min-height:44px;padding:0 10px;border:1.5px solid var(--field);border-radius:8px;background:#fff;font-size:16px}
.krow .kbtn{width:44px;height:44px}

@media (max-width:900px){
  .navbar{position:static}
  .menu a.adm{margin-left:0}
  .roleband .btn{margin-left:0}
}
@media (max-width:760px){.csplit,.psplit,.ptree{grid-template-columns:1fr}}
@media (max-width:700px){
  .wrap{padding:20px 16px 48px}
  .bhead .in,.roleband .in{padding-left:16px;padding-right:16px}
  .menu{padding:6px 16px 0}
  .hero .in{padding:20px 16px 36px}
  .rolebox select{max-width:100%}
}
/* =========================================================
   OPTIMASI LAYAR HP (lebar 700px ke bawah).
   Semua aturan ada di dalam media query ini, sehingga tampilan
   laptop/PC tidak berubah.
   ========================================================= */
@media (max-width:700px){
  html{-webkit-text-size-adjust:100%}
  body{font-size:15px;line-height:1.5}
  .wrap{padding:16px 16px 40px}
  .sec{margin-top:20px}
  .grid,.row{gap:12px}
  .btn{white-space:normal;text-align:center;line-height:1.25}
  .pill{white-space:normal;line-height:1.3}
  .m-hide{display:none}

  /* header bagian: identitas di satu baris, peran di bawahnya */
  .bhead .in{padding:10px 16px 12px;gap:10px}
  .bid{flex-wrap:nowrap;gap:10px;width:100%}
  .bid>div{min-width:0}
  .back{flex:none;min-height:40px;padding:0 10px;gap:4px;font-size:14px}
  .mark{width:40px;height:40px;font-size:14px;border-radius:9px}
  .bname{font-size:18px}
  .bsub{font-size:12.5px;line-height:1.3}

/* Di HP, tabel lebar ditampilkan sebagai kartu per baris. Judul kolom ditempel ke tiap sel. */
function cardifyTables(root){
  root.querySelectorAll('table.t').forEach(tb => {
    const ths = [...tb.querySelectorAll('thead th')];
    if(ths.length <= 2) return;
    const heads = ths.map(th => (th.firstChild && th.firstChild.nodeType === 3 ? th.firstChild.textContent : th.textContent).trim());
    const isCompact = i => /^TW\s?\d$/.test(heads[i]) || /^(Alokasi|Realisasi|Sisa)$/.test(heads[i]) || (heads[0] === 'Indikator' && !!ths[i] && ths[i].classList.contains('r'));
    const compactCols = heads.map((h, i) => i).filter(isCompact);
    const useCompact = compactCols.length >= 3;
    const span = compactCols.length >= 4 ? 3 : 4;
    const titleCol = Math.max(TITLE_HEADS.map(t => heads.indexOf(t)).find(i => i >= 0) ?? 0, 0);
    tb.classList.add('t-card');
    tb.style.setProperty('--u', span);
    const box = tb.closest('.tbox');
    if(box){
      box.classList.add('tbox-card');
      if(ths.some(th => /target \/ realisasi/.test(th.textContent))) box.insertAdjacentHTML('afterbegin', '<div class="m-cap">Di tiap triwulan: angka kecil = target, angka tebal = realisasi.</div>');
    }
    tb.querySelectorAll('tbody tr').forEach(tr => {
      const cells = [...tr.cells], grouped = tr.classList.contains('sub') || tr.classList.contains('tot');
      if(cells.length === 1){ tr.classList.toggle('r-head', grouped); cells[0].classList.add(grouped ? 'c-head' : 'c-full'); }
      let col = 0;
      cells.forEach((td, i) => {
        const head = td.colSpan > 1 ? '' : (heads[col] || '');
        const text = td.textContent.trim(), ctl = td.querySelector('button,input,select,a,label');
        const blank = !text && !ctl && !td.querySelector('.bar');
        const isAct = /^aksi$/i.test(head) || (!head && !!ctl);
        if(cells.length > 1){
          if(blank || (isAct && text === '—' && !ctl)) td.classList.add('c-none');
          else if(grouped ? i === 0 : col === titleCol) td.classList.add('c-title');
          else if(isAct) td.classList.add('c-act');
          else if(useCompact && td.colSpan === 1 && isCompact(col)) td.classList.add('c-u');
          else if(text.length > 30) td.classList.add('c-stack');
        }
        td.dataset.label = head;
        const v = document.createElement('div'); v.className = 'cv';
        while(td.firstChild) v.append(td.firstChild);
        td.append(v);
        col += td.colSpan;
      });
    });
  });
}

function vKeuRealisasi(){
  const {tim, st, q} = state.f;
  let list = KEG.filter(k => (tim==='all'||k.tim===tim) && (st==='all'||statusOf(k)===st) && (!q || (k.nama+' '+k.tempat).toLowerCase().includes(q.toLowerCase())));
  const groups = Object.keys(TIM).map(t=>({t, items:list.filter(k=>k.tim===t)})).filter(g=>g.items.length);
  const T = totals(list);
  const act = k => {
    const s = statusOf(k);
    if(state.role==='admin') return `<button class="btn sm edit" data-act="editReal" data-id="${k.id}">Ubah</button>`;
    if(isUnit() && s==='perlu' && k.tim===viewerTim()) return `<button class="btn sm p" data-act="konfirmasi" data-id="${k.id}">Konfirmasi</button>`;
    if(isUnit() && s==='konf') return `<span class="sm">Menunggu keuangan</span>`;
    return '<span class="sm">—</span>';
  };
  return shell('keu','realisasi',KEU_MENU(), `
  ${heading('Tahun Anggaran 2026','Realisasi Anggaran per Kegiatan', isAdmin()?'<a class="btn" href="#/keu/kelola">Impor dari Excel</a><button class="btn p" data-act="addKeg">Tambah kegiatan</button>':'')}
  ${isUnit()?`<div class="alert info" style="margin-bottom:14px">${svgInfo}<span>Data diinput oleh bagian keuangan. Jika kegiatan tim Anda sudah dilaksanakan tetapi statusnya belum direalisasi, tekan <b>Konfirmasi</b> agar keuangan segera memprosesnya.</span></div>`:''}

    <label class="f">Tim kerja<select data-act="fTim"><option value="all">Semua tim kerja</option>${Object.keys(TIM).map(t=>`<option value="${t}" ${tim===t?'selected':''}>${TIM[t].nama}</option>`).join('')}</select></label>

    <div class="card kpi"><div class="l">Alokasi (sesuai filter)</div><div class="v">${jt(T.a)}</div></div>

function formEmbedUrl(raw){
  const m = raw.match(/src=["']([^"']+)["']/); // boleh menempel kode sematan utuh
  try{
    const u = new URL(m ? m[1] : raw.trim());
    if(u.protocol !== 'https:' || u.hostname !== 'docs.google.com' || !/^\/forms\/.+\/viewform$/.test(u.pathname)) return null;
    u.searchParams.set('embedded', 'true');
    return u.href;
  }catch(err){ return null; }
}

function calGrid(start, mo, items, dayBtn){
  const DAY = 864e5;
  let html = '<div class="cal2"><div class="cal2h">' + ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(h => '<div class="dh">' + h + '</div>').join('') + '</div>';
  for(let w = 0; w < 6; w++){
    const ws = new Date(start); ws.setDate(start.getDate() + w*7);
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    if(w === 5 && ws.getMonth() !== mo) break;
    const segs = items.filter(o => o.s >= ws && o.m <= we).map(o => {
      const a = o.m < ws ? ws : o.m, b = o.s > we ? we : o.s;
      return {o, c0:Math.round((a - ws)/DAY), c1:Math.round((b - ws)/DAY), cl:o.m < ws, cr:o.s > we};
    }).sort((x,y) => x.c0 - y.c0 || (y.c1 - y.c0) - (x.c1 - x.c0));
    const lanes = [];
    segs.forEach(sg => { let l = lanes.findIndex(end => end < sg.c0); if(l < 0){ l = lanes.length; lanes.push(-1); } lanes[l] = sg.c1; sg.l = l; });
    let cells = '';
    for(let i = 0; i < 7; i++){
      const d = new Date(ws); d.setDate(ws.getDate() + i);
      const inM = d.getMonth() === mo, today = d.toDateString() === TODAY.toDateString();
      cells += `<div class="wd ${inM ? '' : 'out'} ${today ? 'today' : ''}" style="grid-column:${i+1};grid-row:1 / -1">` +
        (dayBtn ? `<button class="dnb" data-act="calAdd" data-date="${iso(d)}" aria-label="Tambah agenda ${d.getDate()} ${BULAN_PANJANG[d.getMonth()]}" title="Klik untuk menambah agenda">${d.getDate()}</button>` : `<span class="dn">${d.getDate()}</span>`) + '</div>';
    }
    const evs = segs.map(sg => {
      const multi = sg.o.m < sg.o.s, n = sg.c1 - sg.c0 + 1;
      return `<button class="ev2 ${sg.cl ? 'cl' : ''} ${sg.cr ? 'cr' : ''}"${sg.o.act ? ` data-act="${sg.o.act}" data-id="${sg.o.id}"` : ''} title="${esc(sg.o.title)}" style="grid-column:${sg.c0+1} / ${sg.c1+2};grid-row:${sg.l+2};${sg.o.style}">` +
        (sg.cl ? '◂ ' : '') + esc(sg.o.label) + (multi && n >= 2 ? `<span class="rng">${rentang(iso(sg.o.m), iso(sg.o.s))}</span>` : '') + (sg.cr ? ' ▸' : '') + '</button>';
    }).join('');
    html += `<div class="wk" style="--mrows:${lanes.length ? `repeat(${lanes.length},9px)` : ''} ;grid-template-rows:32px ${lanes.length ? `repeat(${lanes.length},28px) ` : ''}minmax(${Math.max(10, 84 - lanes.length*31)}px,1fr)">${cells}${evs}</div>`;
  }
  return html + '</div>';
}

function parseNum(v){
  if(v == null) return null; if(typeof v === 'number') return v;
  let s = String(v).trim(); if(!s || s === '-' || /^na$/i.test(s) || s.includes('#')) return null;
  const pc = s.includes('%'); s = s.replace('%','').replace(/\s/g,'');
  if(s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(',','.');
  const x = parseFloat(s); if(isNaN(x)) return null; return pc ? x/100 : x;
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || ''; const dl = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){ const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true; else if(c === dl){ row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c; }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function rowsToImport(rows){
  const h = rows.findIndex(r => r.some(c => String(c||'').trim().toLowerCase() === 'kode unit'));
  if(h < 0) return {error:'Kolom "Kode Unit" tidak ditemukan. Gunakan template dari halaman ini.'};
  const H = rows[h].map(c => String(c||'').trim().toLowerCase()); const col = n => H.indexOf(n.toLowerCase());
  const units = {}, errors = []; let year = null, count = 0;
  rows.slice(h+1).forEach((r, i) => {
    const kode = String(r[col('Kode Unit')] || '').trim().toUpperCase(); const ind = String(r[col('Indikator / Kegiatan')] || '').trim();
    if(!kode && !ind) return;
    if(!UNIT_META[kode]){ errors.push(`Baris ${h+i+2}: kode unit "${kode || '(kosong)'}" tidak dikenal`); return; }
    if(!ind){ errors.push(`Baris ${h+i+2}: indikator/kegiatan kosong`); return; }
    const th = parseNum(r[col('Tahun')]); if(th) year = year || th;
    const jenis = UNIT_META[kode].jenis;
    const t = [1,2,3,4].map(n => parseNum(r[col('Target TW'+n)])), re = [1,2,3,4].map(n => parseNum(r[col('Realisasi TW'+n)]));
    const it = {ikk:String(r[col('IKK')]||'').replace(/^ikk\s*/i,'').trim() || (jenis === 'timker' ? '1.1' : '2.2'), program:String(r[col('Program / IKI')]||'').trim(), ind,
      tipe:String(r[col('Tipe')]||'').trim().toLowerCase() === 'persen' || jenis === 'timker' ? 'persen' : 'jumlah', r:re};
    if(jenis === 'timker'){ it.t = t.map(v => v != null && v > 1.5 ? v/100 : v); it.r = re.map(v => v != null && v > 1.5 ? v/100 : v); }
    else { it.rencana = parseNum(r[col('Rencana Output')]); it.rlabel = String(r[col('Satuan / Keterangan')]||'').trim() || (it.rencana != null ? String(it.rencana) : '—');
      if(it.rencana == null) errors.push(`Baris ${h+i+2}: rencana output kosong (${ind.slice(0,40)}…)`); }
    (units[kode] = units[kode] || []).push(it); count++;
  });
  return {year: year || PRC.year, units, errors, count};
}
function applyImport(imp, year){

  });

function createYear(y, opt){

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E6EAF0" stroke-width="14"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*val} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="${sub ? '47%' : '53%'}" text-anchor="middle" font-size="${size/6.2}" font-weight="800" fill="#14202E">${pp(v)}</text>
    ${sub ? `<text x="50%" y="62%" text-anchor="middle" font-size="13" fill="#45546A">${sub}</text>` : ''}
  </svg>`;
}
function twChart(){
  const ph = isPhone(), W = ph ? 380 : 600, H = 250, pl = ph ? 50 : 52, pr = ph ? 4 : 10, pt = 18, pb = 34, iw = W-pl-pr, ih = H-pt-pb, tw = TWc();
  const S = [{k:'1.1', c:'var(--acc)', l:'IKK 1.1'}, {k:'1.2', c:'#E08A1E', l:'IKK 1.2'}];
  const y = v => pt + ih - v*ih; let g = '';
  [0,.25,.5,.75,1].forEach(v => g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAF0"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="14" fill="#5B6B7F">${v*100}%</text>`);
  const gw = iw/4, bw = ph ? 30 : 46;
  [1,2,3,4].forEach(q => {
    const x0 = pl + gw*(q-1) + gw/2;
    S.forEach((s, j) => {
      const a = antara(s.k, q), x = x0 - bw - 4 + j*(bw+8);
      if(a.reported){ g += `<rect x="${x}" y="${y(a.total)}" width="${bw}" height="${ih - (y(a.total)-pt)}" rx="4" fill="${s.c}"/><text x="${x+bw/2}" y="${y(a.total)-6}" text-anchor="middle" font-size="${ph?11.5:14}" font-weight="700" fill="#14202E">${pp(a.total)}</text>`; }
      else g += `<rect x="${x}" y="${y(1)}" width="${bw}" height="${ih}" rx="4" fill="none" stroke="#C9D2DE" stroke-dasharray="4 4"/>`;
    });
    g += `<text x="${x0}" y="${H-12}" text-anchor="middle" font-size="${ph?13:15}" font-weight="${q===tw?800:500}" fill="${q===tw?'#14202E':'#5B6B7F'}">TW${q}${q > tw ? ' · belum' : ''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Capaian antara IKK 1.1 dan 1.2 per triwulan">${g}</svg>
    <div class="legend">${S.map(s => `<span><i style="background:${s.c}"></i>Capaian antara ${s.l}</span>`).join('')}<span><i style="border:1px dashed #A5B1C0;background:#fff"></i>Triwulan belum dilaporkan</span></div>`;
}

}

function vPrcKalender(){

  const end = new Date(start); end.setDate(start.getDate()+41);
  const add = canAddAgenda();
  const items = occurrences(start, end).map(o => o.type === 'agenda'
    ? {m:o.m, s:o.s, label:(o.ev.jam ? o.ev.jam.slice(0,5) + ' ' : '') + o.ev.judul, title:o.ev.judul, act:'evOpen', id:o.ev.id, style:'background:' + KAT[o.ev.kat].t + ';color:' + KAT[o.ev.kat].c}

  ${heading('Perencanaan · agenda & jadwal kegiatan', 'Kalender Perencanaan', add ? '<button class="btn p" data-act="calAdd" data-date="">+ Tambah agenda</button>' : '')}

      <label style="display:flex;align-items:center;gap:6px;font-weight:600"><input type="checkbox" data-act="layer" data-l="keg" ${PRC.layers.keg?'checked':''} style="width:18px;height:18px">Jadwal kegiatan tim kerja</label>
    </div>
  </div>

    ${monthOcc.length ? monthOcc.map(o => o.type === 'agenda' ? `<tr><td class="num" style="white-space:nowrap">${rentang(iso(o.m), iso(o.s))}${o.ev.jam?'<div class="sm">'+o.ev.jam+'</div>':''}</td><td><b>${esc(o.ev.judul)}</b>${o.ev.ulang?' <span class="pill mu">berulang tiap bulan</span>':''}</td>

        <td>${canEditAgenda(o.ev) ? `<button class="btn sm edit" data-act="evEdit" data-id="${o.ev.id}">Ubah</button>` : `<button class="btn sm" data-act="evOpen" data-id="${o.ev.id}">Detail</button>`}</td></tr>`

}

/* ---------- modal isi data indikator ---------- */
function itemModal(k, idx){
  const it = unitOf(k).items[idx], timker = !!it.t, adm = prcIsAdmin(), persen = it.tipe === 'persen';
  const show = v => v == null ? '' : persen ? Math.round(v*10000)/100 : v;
  $('#modal').innerHTML = `<div class="ov" data-act="ovClose"><form class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" onsubmit="return false" style="max-width:620px">
    <h3 id="mt">Isi realisasi · ${UNIT_META[k].s}</h3><div class="sm" style="font-size:15px">${esc(it.ind)}</div>
    ${!timker ? `<label class="f">Rencana output ${adm?'':'(diatur admin)'}<input id="iRen" class="num" value="${show(it.rencana)}" ${adm?'':'disabled'}></label>` : ''}
    <div class="tbox"><table class="t"><thead><tr><th></th>${[1,2,3,4].map(q => `<th class="r">TW${q}</th>`).join('')}</tr></thead><tbody>
      ${timker ? `<tr><td class="sm">Target ${persen?'(%)':''}</td>${[0,1,2,3].map(i => `<td class="r"><input class="num" id="iT${i}" value="${show(it.t[i])}" ${adm?'':'disabled'} style="width:76px;text-align:right;min-height:42px;border:1.5px solid var(--field);border-radius:6px"></td>`).join('')}</tr>` : ''}
      <tr><td class="sm"><b>Realisasi ${persen?'(%)':''}</b></td>${[0,1,2,3].map(i => `<td class="r"><input class="num" id="iR${i}" value="${show(it.r[i])}" style="width:76px;text-align:right;min-height:42px;border:1.5px solid var(--field);border-radius:6px" ${i+1>TWc()&&!adm?'disabled':''}></td>`).join('')}</tr>
    </tbody></table></div>
    <span class="sm">${persen ? 'Isi dalam persen, mis. 75 untuk 75%.' : 'Isi jumlah output yang selesai pada triwulan tersebut.'} Kosongkan jika belum ada. ${!adm ? 'Target hanya dapat diubah admin perencanaan.' : ''}</span>
    <label class="f">Bukti dukung (opsional)<input type="file"></label>
    <div class="acts" style="justify-content:flex-end"><button class="btn" data-act="mClose">Batal</button><button class="btn p" data-act="itemSave" data-k="${k}" data-i="${idx}">Simpan</button></div>
  </form></div>`;
  const f = document.querySelector('#modal input:not([disabled])'); if(f) f.focus();
}

/* ---------- event khusus perencanaan ---------- */
function prcClick(el, a, e){
  const tw = TWc();
  switch(a){
    case 'goIkk': PRC.ikkTab = el.dataset.ikk; PRC.twTab = tw; return true;
    case 'unitSel': PRC.unitSel = el.dataset.k; rerender(); return true;
    case 'ikkTab': PRC.ikkTab = el.dataset.ikk; rerender(); return true;
    case 'twTab': PRC.twTab = +el.dataset.tw; rerender(); return true;
    case 'editItem': itemModal(el.dataset.k, +el.dataset.i); return true;
    case 'itemSave': {
      const it = unitOf(el.dataset.k).items[+el.dataset.i], persen = it.tipe === 'persen';
      const rd = id => { const x = $('#'+id); if(!x) return undefined; const v = parseNum(x.value); return v == null ? null : persen ? v/100 : v; };
      [0,1,2,3].forEach(i => { const r = rd('iR'+i); if(r !== undefined) it.r[i] = r; if(it.t){ const t = rd('iT'+i); if(t !== undefined && prcIsAdmin()) it.t[i] = t; } });
      if(!it.t && $('#iRen') && prcIsAdmin()){ const v = parseNum($('#iRen').value); if(v != null) it.rencana = persen ? v/100 : v; }
      closeModal(); rerender(); toast('Tersimpan. Capaian unit, IKK, dan grafik sudah dihitung ulang.'); return true; }
    case 'dlUnit': { const k = el.dataset.k; const rows = dataRows(PRC.year).filter((r,i) => i === 0 || r[1] === k); downloadRows(`Capaian_${UNIT_META[k].s}_${PRC.year}`, rows, !!window.XLSX); return true; }
    case 'dlAuto': downloadRows(el.dataset.a === 'rekap' ? `Rekap_capaian_unit_${PRC.year}` : `Capaian_antara_IKK_${PRC.year}`, el.dataset.a === 'rekap' ? rekapRows() : antaraRows(), !!window.XLSX); toast('Berkas dibuat dari data terbaru'); return true;
    case 'pcalPrev': if(--PRC.calM < 0){ PRC.calM = 11; PRC.calY--; } rerender(); return true;
    case 'pcalNext': if(++PRC.calM > 11){ PRC.calM = 0; PRC.calY++; } rerender(); return true;
    case 'pcalToday': PRC.calM = TODAY.getMonth(); PRC.calY = TODAY.getFullYear(); rerender(); return true;
    case 'calAdd': agendaModal(null, el.dataset.date); return true;
    case 'evEdit': agendaModal(AGENDA.find(x => x.id == el.dataset.id)); return true;
    case 'evOpen': { const ev = AGENDA.find(x => x.id == el.dataset.id); if(canEditAgenda(ev)){ agendaModal(ev); return true; }
      $('#modal').innerHTML = `<div class="ov" data-act="ovClose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><span class="tag" style="align-self:flex-start;background:${KAT[ev.kat].t};color:${KAT[ev.kat].c}">${KAT[ev.kat].l}</span><h3 id="mt">${esc(ev.judul)}</h3>
        <div>${ev.ulang ? 'Setiap tanggal ' + D(ev.m).getDate() + ' tiap bulan' : rentang(ev.m, ev.s) + ' ' + D(ev.m).getFullYear()}${ev.jam ? ' · ' + ev.jam : ''}</div><div class="sm">Unit: ${UNIT_META[ev.unit]?.nama || '—'} · Tempat: ${esc(ev.lokasi || '—')}</div>${ev.ket ? `<p style="margin:0">${esc(ev.ket)}</p>` : ''}
        <div class="acts" style="justify-content:flex-end"><button class="btn" data-act="mClose">Tutup</button></div></div></div>`; return true; }
    case 'kegOpen': { const k = KEG.find(x => x.id == el.dataset.id);
      $('#modal').innerHTML = `<div class="ov" data-act="ovClose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><span class="tag" style="align-self:flex-start;background:${TIM[k.tim].t};color:${TIM[k.tim].c}">Kegiatan ${TIM[k.tim].nama}</span><h3 id="mt">${esc(k.nama)}</h3>
        <div>${rentang(k.m,k.s)} 2026 · ${esc(k.tempat)} · ${k.mode}</div>${k.resch ? `<div><span class="pill warn">Dijadwal ulang</span> <span class="sm">semula ${k.resch}</span></div>` : ''}<div class="sm">Data dari program kegiatan tim kerja; sama dengan kalender Keuangan. Perubahan jadwal dilakukan oleh tim kerja terkait.</div>
        <div class="acts" style="justify-content:flex-end"><button class="btn" data-act="mClose">Tutup</button></div></div></div>`; return true; }
    case 'evSave': {
      const j = $('#aJ').value.trim(), m = $('#aM').value, s = $('#aS').value || m;
      if(!j || !m || s < m){ toast(!j ? 'Judul agenda wajib diisi' : 'Tanggal tidak valid'); return true; }
      const data = {judul:j, m, s, jam:$('#aT').value.trim(), kat:$('#aK').value, unit:$('#aU').value, lokasi:$('#aL').value.trim(), ulang:$('#aR').checked, ket:$('#aC').value.trim()};
      if(el.dataset.id){ Object.assign(AGENDA.find(x => x.id == el.dataset.id), data); } else AGENDA.push({id:++AGENDA_ID, ...data});

function prcChange(el, a){
  switch(a){
    case 'prcYear': PRC.year = +el.value; PRC.twTab = Math.min(PRC.twTab, 4); rerender(); return true;
    case 'layer': PRC.layers[el.dataset.l] = el.checked; rerender(); return true;
    case 'nka': { const v = parseNum(el.value); PRC.nka[PRC.year][el.dataset.f] = v; rerender(); toast('NKA dihitung ulang'); return true; }
    case 'sakip': PRC.sakip[PRC.year][+el.dataset.i][1] = el.checked; rerender(); return true;
    case 'sakipNilai': PRC.sakipNilai[PRC.year] = parseNum(el.value); rerender(); return true;
    case 'setTW': PRC.meta[+el.dataset.y].tw = +el.value; rerender(); toast('Triwulan berjalan diubah'); return true;
    case 'bobot': PRC.bobot[el.dataset.k] = parseNum(el.value) || 0; rerender(); return true;
    case 'basis': { const v = parseNum(el.value); PRC.basis[PRC.year][el.dataset.kind][el.dataset.k][+el.dataset.i] = v == null ? null : v/100; rerender(); toast('Basis diperbarui, capaian antara dihitung ulang'); return true; }
    case 'dlYear': PRC.dl.year = el.value; rerender(); return true;
    case 'impFile': {
      const f = el.files[0]; if(!f) return true;
      const done = rows => { const r = rowsToImport(rows); r.file = f.name; PRC.pendingImport = r; rerender(); };
      if(/\.xlsx?$/i.test(f.name)){
        if(!window.XLSX){ PRC.pendingImport = {error:'File .xlsx butuh koneksi internet untuk dibaca di mockup ini. Simpan sebagai CSV dari Excel lalu unggah ulang.', file:f.name}; rerender(); return true; }
        f.arrayBuffer().then(buf => { const wb = XLSX.read(buf, {type:'array'}); const ws = wb.Sheets[wb.SheetNames[0]]; done(XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''})); });
      } else f.text().then(t => done(parseCSV(t)));
      return true; }
  }
  return false;
}

const klnClock = () => { const n = new Date(); return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); };
const klnStamp = (date, time) => { const d = D(date); return `${d.getDate()} ${BULAN[d.getMonth()]}, ${time.replace(':','.')}`; };
const ymToExp = v => { const [y, m] = v.split('-'); return `${BULAN[Number(m)-1]} ${y}`; };
const expToYm = e => { const [b, y] = String(e).split(' '), m = BULAN.indexOf(b); return m < 0 ? '' : `${y}-${String(m+1).padStart(2,'0')}`; };
function expMonths(o){ const [b, y] = String(o[4]).split(' '), m = BULAN.indexOf(b); return m < 0 ? null : (Number(y)-TODAY.getFullYear())*12 + m - TODAY.getMonth(); }
const expSoon = o => { const e = expMonths(o); return e != null && e >= 0 && e <= 2; };
function obatStatus(o){
  const e = expMonths(o);
  if(e != null && e < 0) return ['Kedaluwarsa','bad'];
  return o[1] === 0 ? ['Habis','bad'] : o[1] < o[3] ? ['Menipis','warn'] : expSoon(o) ? ['Segera kedaluwarsa','warn'] : ['Aman','ok'];
}

  smPreview();
}
function smPreview(){
  const v = $('#smO').value, isNew = v === 'new', q = Math.max(0, parseInt($('#smQ').value, 10) || 0);
  $('#smNew').classList.toggle('hide', !isNew);
  const o = isNew ? null : OBAT[Number(v)], cur = o ? o[1] : 0, u = esc(o ? o[2] : $('#smU').value);
  $('#smPrev').innerHTML = `<span>Stok sekarang <b>${cur} ${u}</b></span><span>Setelah masuk <b>${cur+q} ${u}</b></span>`;
}
function smSave(){
  const v = $('#smO').value, isNew = v === 'new', q = parseInt($('#smQ').value, 10), date = $('#smD').value;
  if(!(q >= 1)){ toast('Isi jumlah masuk minimal 1'); $('#smQ').focus(); return; }
  if(!date){ toast('Isi tanggal masuk'); $('#smD').focus(); return; }
  const ex = $('#smE').value ? ymToExp($('#smE').value) : '—', bast = $('#smB').value.trim();
  let i = Number(v);
  if(isNew){
    const nama = $('#smN').value.trim(), min = parseInt($('#smM').value, 10);
    if(!nama){ toast('Nama obat wajib diisi'); $('#smN').focus(); return; }
    if(OBAT.some(o => o[0].toLowerCase() === nama.toLowerCase())){ toast('Obat ini sudah ada di daftar'); $('#smN').focus(); return; }
    if(!(min >= 0)){ toast('Stok minimum tidak valid'); $('#smM').focus(); return; }
    OBAT.push([nama, 0, $('#smU').value, min, ex]); i = OBAT.length - 1;
  } else OBAT[i][4] = ex;
  const o = OBAT[i], before = o[1];
  mutasiObat(i, q, 'Masuk', $('#smS').value + (bast ? ' · ' + bast : ''), klnStamp(date, klnClock()));
  closeModal(); rerender(); stokToast(o, before);
}

function aturStokModal(i){
  const o = OBAT[i]; KLN.asIdx = i; KLN.asMode = 'masuk';
  klnModal('asSave', 'Atur stok · ' + esc(o[0]), `Stok sekarang ${o[1]} ${esc(o[2])}`, `
    <div class="seg kseg" role="group" aria-label="Jenis perubahan">${Object.entries(AS_MODE).map(([k,m]) => `<button type="button" data-act="asMode" data-m="${k}" class="${k==='masuk'?'on':''}">${m.l}</button>`).join('')}</div>
    ${dua(`<label class="f"><span id="asQL">Jumlah masuk</span><input id="asQ" data-act="asLive" class="num" type="number" min="0" inputmode="numeric" placeholder="0"></label><label class="f">Alasan<select id="asR"></select></label>`)}
    <div class="kprev" id="asPrev" aria-live="polite"></div>
    ${dua(`<label class="f">Stok minimum<input id="asMin" class="num" type="number" min="0" inputmode="numeric" value="${o[3]}"></label><label class="f">Kedaluwarsa<input id="asE" type="month" value="${expToYm(o[4])}"></label>`)}`, 'Simpan perubahan');
  asSwitch('masuk');
}
function asSwitch(m){
  KLN.asMode = m;
  document.querySelectorAll('[data-act="asMode"]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#asQL').textContent = AS_MODE[m].q;
  $('#asR').innerHTML = AS_MODE[m].r.map(r => `<option>${r}</option>`).join('');
  $('#asQ').value = '';
  asPreview();
}
function asTarget(){
  const o = OBAT[KLN.asIdx], q = parseInt($('#asQ').value, 10);
  if(isNaN(q)) return o[1];
  return KLN.asMode === 'masuk' ? o[1] + q : KLN.asMode === 'keluar' ? o[1] - q : q;
}
function asPreview(){
  const o = OBAT[KLN.asIdx], t = asTarget(), u = esc(o[2]);
  $('#asPrev').innerHTML = `<span>Stok sekarang <b>${o[1]} ${u}</b></span><span>Setelah disimpan <b style="${t<0?'color:var(--bad)':''}">${t<0?'stok tidak cukup':t+' '+u}</b></span>`;
}
function asSave(){
  const i = KLN.asIdx, o = OBAT[i], m = KLN.asMode, raw = $('#asQ').value.trim(), q = parseInt(raw, 10), min = parseInt($('#asMin').value, 10);
  const ex = $('#asE').value ? ymToExp($('#asE').value) : '—';
  if(!(min >= 0)){ toast('Stok minimum tidak valid'); $('#asMin').focus(); return; }
  let delta = 0;
  if(raw !== ''){
    if(isNaN(q) || q < 0 || (m !== 'koreksi' && q < 1)){ toast('Jumlah tidak valid'); $('#asQ').focus(); return; }
    if(m === 'keluar' && q > o[1]){ toast(`Stok hanya tersisa ${o[1]} ${o[2]}`); $('#asQ').focus(); return; }
    delta = m === 'masuk' ? q : m === 'keluar' ? -q : q - o[1];
  }
  const meta = min !== o[3] || ex !== o[4];
  if(!delta && !meta){ toast('Isi jumlah atau ubah data obat terlebih dahulu'); $('#asQ').focus(); return; }
  const before = o[1], alasan = $('#asR').value;
  o[3] = min; o[4] = ex;
  if(delta) mutasiObat(i, delta, AS_MODE[m].l, alasan);
  closeModal(); rerender();
  if(delta) stokToast(o, before); else toast(`Data ${o[0]} diperbarui`);
}

/* catat kunjungan */
const klnUnits = () => [...TIMKER_KEYS.map(k => 'Timker ' + UNIT_META[k].s), ...URUSAN_KEYS.map(k => UNIT_META[k].s)];
function vRowHtml(){
  const dipakai = [...document.querySelectorAll('.vO')].map(s => Number(s.value));
  const pilih = OBAT.findIndex((o,i) => o[1] > 0 && !dipakai.includes(i));
  return `<div class="krow"><select class="vO" aria-label="Obat">${OBAT.map((o,i)=>`<option value="${i}" ${o[1]===0?'disabled':''} ${i===pilih?'selected':''}>${esc(o[0])} · sisa ${o[1]} ${esc(o[2])}</option>`).join('')}</select><input class="vQ num" type="number" min="1" inputmode="numeric" value="1" aria-label="Jumlah"><button type="button" class="kbtn" data-act="vDel" aria-label="Hapus obat ini">×</button></div>`;
}
function kunjunganModal(){
  klnModal('vSave', 'Catat kunjungan', 'Nama ditampilkan sebagai inisial di daftar. Obat yang diberikan otomatis mengurangi stok.', `
    ${dua(`<label class="f">Tanggal<input id="vT" type="date" min="2026-01-01" max="${iso(TODAY)}" value="${iso(TODAY)}"></label><label class="f">Jam<input id="vJ" type="time" value="${klnClock()}"></label>`)}
    <label class="f">Nama pegawai<input id="vN" placeholder="Tulis nama lengkap" autocomplete="off"></label>
    <label class="f">Unit<select id="vU">${klnUnits().map(u=>`<option>${esc(u)}</option>`).join('')}</select></label>
    <label class="f">Keluhan<select id="vK" data-act="vLive">${KELUHAN_OPSI.map(k=>`<option>${esc(k)}</option>`).join('')}<option value="lain">Lainnya</option></select></label>
    <label class="f hide" id="vKLWrap">Tulis keluhan<input id="vKL" placeholder="mis. Sakit gigi"></label>
    ${dua(`<label class="f">Tensi (opsional)<input id="vTs" placeholder="120/80"></label><label class="f">Suhu °C (opsional)<input id="vS" inputmode="decimal" placeholder="36,5"></label>`)}
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="f">Obat yang diberikan</div>
      <div id="vRows" style="display:flex;flex-direction:column;gap:8px"></div>
      <button type="button" class="btn sm" data-act="vAdd" style="align-self:flex-start">+ Tambah obat</button>
    </div>
    <label class="f">Tindakan / catatan (opsional)<input id="vC" placeholder="mis. istirahat 30 menit"></label>`, 'Simpan kunjungan');
}
function vSave(){
  const date = $('#vT').value, jam = $('#vJ').value, nama = $('#vN').value.trim(), lain = $('#vK').value === 'lain', kel = lain ? $('#vKL').value.trim() : $('#vK').value;
  if(!date){ toast('Isi tanggal kunjungan'); $('#vT').focus(); return; }
  if(!jam){ toast('Isi jam kunjungan'); $('#vJ').focus(); return; }
  if(!nama){ toast('Nama pegawai wajib diisi'); $('#vN').focus(); return; }
  if(!kel){ toast('Tulis keluhan pegawai'); $('#vKL').focus(); return; }
  const pakai = new Map();
  for(const row of document.querySelectorAll('#vRows .krow')){
    const i = Number(row.querySelector('.vO').value), q = parseInt(row.querySelector('.vQ').value, 10);
    if(!(q >= 1)){ toast('Jumlah obat minimal 1'); row.querySelector('.vQ').focus(); return; }
    pakai.set(i, (pakai.get(i) || 0) + q);
  }
  for(const [i, q] of pakai) if(q > OBAT[i][1]){ toast(`Stok ${OBAT[i][0]} hanya tersisa ${OBAT[i][1]} ${OBAT[i][2]}`); return; }
  const stamp = klnStamp(date, jam), inisial = nama.split(/\s+/).slice(0,2).map(w => w[0].toUpperCase() + '.').join('');
  const tensi = $('#vTs').value.trim(), suhu = $('#vS').value.trim(), cat = $('#vC').value.trim();
  const obatTeks = [...pakai].map(([i, q]) => `${OBAT[i][0]} ${q} ${OBAT[i][2]}`);
  pakai.forEach((q, i) => mutasiObat(i, -q, 'Keluar', 'Diberikan saat kunjungan', stamp));
  KUNJ.unshift([stamp, inisial, $('#vU').value, kel, [...obatTeks, cat].filter(Boolean).join(', ') || '—', [tensi && 'Tensi ' + tensi, suhu && suhu + ' °C'].filter(Boolean).join(' · '), true]);
  const bln = D(date).getMonth();
  if(bln < KUNJ_BLN.length) KUNJ_BLN[bln]++;
  if(bln === TODAY.getMonth()){ const k = KLN.keluhan.find(x => x[0] === kel); if(k) k[1]++; else KLN.keluhan.push([kel, 1]); }
  closeModal(); rerender();
  toast(`Kunjungan ${inisial} tercatat${pakai.size ? ' · stok obat diperbarui' : ''}`);
}

function klnClick(el, a){
  switch(a){
    case 'stokMasuk': stokMasukModal(); return true;
    case 'kunjungan': kunjunganModal(); return true;
    case 'smSave': smSave(); return true;
    case 'asSave': asSave(); return true;
    case 'vSave': vSave(); return true;
    case 'asMode': asSwitch(el.dataset.m); return true;
    case 'oAtur': aturStokModal(Number(el.dataset.i)); return true;
    case 'oReset': KLN.q = ''; KLN.st = 'all'; rerender(); return true;
    case 'oInc': case 'oDec': { const i = Number(el.dataset.i), o = OBAT[i], before = o[1], d = a === 'oInc' ? 1 : -1;
      if(before + d < 0) return true;
      mutasiObat(i, d, 'Koreksi', 'Penyesuaian cepat'); rerender(); stokToast(o, before); return true; }
    case 'vAdd': { if(!OBAT.some(o => o[1] > 0)){ toast('Semua stok obat habis'); return true; } $('#vRows').insertAdjacentHTML('beforeend', vRowHtml()); return true; }
    case 'vDel': el.closest('.krow').remove(); return true;
  }
  return false;
}
function klnInput(el, a){
  if(a === 'oQ'){ KLN.q = el.value; rerender('[data-act="oQ"]'); return; }
  if(a === 'oSt'){ KLN.st = el.value; rerender(); return; }
  if(a === 'smLive'){ if(el.id === 'smO' && el.value !== 'new') $('#smE').value = expToYm(OBAT[Number(el.value)][4]); smPreview(); return; }
  if(a === 'asLive'){ asPreview(); return; }
  if(a === 'vLive'){ $('#vKLWrap').classList.toggle('hide', el.value !== 'lain'); }
}

/* ================= ROUTER ================= */
const ROUTES = {
  '':vPortal, 'keu':vKeu, 'keu/realisasi':vKeuRealisasi, 'keu/jadwal':vKeuJadwal, 'keu/st':vKeuST, 'keu/unggah':vKeuUnggah, 'keu/format':vKeuFormat, 'keu/form':vKeuForm, 'keu/kelola':vKeuKelola,
  'prc':vPrc, 'prc/capaian':vPrcCapaian, 'prc/pengukuran':vPrcPengukuran, 'prc/kalender':vPrcKalender, 'prc/struktur':vPrcStruktur, 'prc/unduh':vPrcUnduh, 'prc/kelola':vPrcKelola, 'kln':vKln, 'kln/obat':vKlnObat
};
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const v = ROUTES[h] || vPortal;
  $('#app').innerHTML = v();
  afterRender();
  document.title = (h ? (BAGIAN[h.split('/')[0]]?.nama || 'Portal') + ' · ' : '') + 'Mockup Dashboard Subbag Umum';
}
function rerender(keepFocusSel){
  const y = window.scrollY; route(); window.scrollTo(0,y);
  if(keepFocusSel){ const el = $(keepFocusSel); if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; } }
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); });

/* ================= EVENTS ================= */
document.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if(prcChange(e.target, a)) return;
  if(a==='role'){ state.role = e.target.value; rerender(); toast('Tampilan: ' + e.target.options[e.target.selectedIndex].text); }
  if(a==='fTim'){ state.f.tim = e.target.value; rerender(); }
  if(a==='fSt'){ state.f.st = e.target.value; rerender(); }
  if(a==='stJenis'){ state.stf.jenis = e.target.value; rerender(); }
  if(a==='stDok'){ state.stf.dok = e.target.value; rerender(); }
  if(a==='file'){ const f = e.target.files[0]; if(f){ const t = document.getElementById(e.target.dataset.target); if(t) t.textContent = f.name; } }
  if(e.target.id==='kSel'){ const k = KEG.find(x=>x.id==e.target.value); $('#kA').value=k.a; $('#kR').value=k.r; $('#kS').value=k.st; }
});
document.addEventListener('input', e => {
  const a = e.target.dataset.act;
  klnInput(e.target, a);
  if(a==='dlQ'){ PRC.dl.q = e.target.value; rerender('[data-act="dlQ"]'); }
  if(a==='fQ'){ state.f.q = e.target.value; rerender('[data-act="fQ"]'); }
  if(a==='nom'){
    e.target.value = e.target.value.replace(/[^0-9]/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const tot = [...document.querySelectorAll('[data-act="nom"]')].reduce((s,i)=>s+Number(i.value.replace(/\./g,'')||0),0);
    $('#upTotal').textContent = rp(tot);
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  if(prcClick(el, a, e)) return;
  if(klnClick(el, a)) return;
  if(a==='goPerlu'){ state.f = {tim:'all', st:'perlu', q:''}; }
  if(a==='goTim'){ state.f = {tim:el.dataset.tim, st:'all', q:''}; }
  if(a==='goTimPerlu'){ state.f = {tim:el.dataset.tim, st:'perlu', q:''}; }
  if(a==='formSend'){ const f = el.closest('form'); if(f.reportValidity()){ f.reset(); toast('Jawaban terkirim (simulasi mockup)'); } }
  if(a==='formSet'){
    const raw = $('#fmUrl').value, url = formEmbedUrl(raw);
    state.form = url ? {url, draft:'', err:false} : {url:state.form.url, draft:raw, err:true};
    rerender(); if(url) toast('Google Form terpasang');
  }
  if(a==='formClear'){ state.form = {url:'', draft:'', err:false}; rerender(); toast('Kembali ke contoh tampilan'); }
  if(a==='fReset'){ state.f = {tim:'all', st:'all', q:''}; rerender(); }
  if(a==='calPrev'){ state.cal--; rerender(); }
  if(a==='calNext'){ state.cal++; rerender(); }
  if(a==='calToday'){ state.cal = 9; rerender(); }
  if(a==='konfirmasi'){ state.confirmed.add(Number(el.dataset.id)); rerender(); toast('Konfirmasi terkirim ke bagian keuangan'); }
  if(a==='dl'){ e.preventDefault(); toast('Unduhan dimulai (simulasi mockup)'); }
  if(a==='print'){ window.print(); }
  if(a==='ingat'){ toast('Pengingat unggah dokumen dikirim ke ' + el.dataset.peg); }
  if(a==='toastOnly'){ toast(el.dataset.msg); }
  if(a==='addFormat'||a==='addKeg'){ toast('Form input dibuka (simulasi mockup)'); }
  if(a==='import'){ toast('Data anggaran tersimpan (simulasi mockup)'); }
  if(a==='saveReal'){
    const k = KEG.find(x=>x.id==$('#kSel').value);
    k.a = Number(String($('#kA').value).replace(',','.'))||k.a; k.r = Number(String($('#kR').value).replace(',','.'))||0; k.st = $('#kS').value;
    toast('Tersimpan: ' + k.nama + ' — cek di menu Realisasi');
  }
  if(a==='submitUpload'){
    const total = Number(($('#upTotal').textContent).replace(/[^0-9]/g,''));
    const stNo = $('#upST').value;
    state.uploads.unshift({st:stNo, total, waktu:'28 Okt 2026, ' + new Date().toTimeString().slice(0,5)});
    const s = ST.find(x=>x.no===stNo); if(s && s.dok!=='akan'){ s.dok = 'lengkap'; s.biaya = total; }
    rerender(); toast('Dokumen terkirim ke bagian keuangan');
  }
  if(a==='editReal'){
    const k = KEG.find(x=>x.id==el.dataset.id);
    $('#modal').innerHTML = `<div class="ov" data-act="ovClose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h3 id="mt">Ubah realisasi</h3><div class="sm">${TIM[k.tim].nama} · ${esc(k.nama)}</div>
      <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <label class="f">Alokasi (juta Rp)<input id="mA" class="num" value="${k.a}"></label>
        <label class="f">Realisasi (juta Rp)<input id="mR" class="num" value="${k.r}"></label></div>
      <label class="f">Status<select id="mS">${['belum','perlu','proses','selesai'].map(s=>`<option value="${s}" ${k.st===s?'selected':''}>${STATUS[s].l}</option>`).join('')}</select></label>
      <div class="acts" style="justify-content:flex-end"><button class="btn" data-act="mClose">Batal</button><button class="btn p" data-act="mSave" data-id="${k.id}">Simpan</button></div>
    </div></div>`;
    $('#mR').focus();
  }
  if(a==='mSave'){
    const k = KEG.find(x=>x.id==el.dataset.id);
    k.a = Number($('#mA').value.replace(',','.'))||k.a; k.r = Number($('#mR').value.replace(',','.'))||0; k.st = $('#mS').value;
    state.confirmed.delete(k.id); closeModal(); rerender(); toast('Realisasi diperbarui');
  }
  if(a==='resched'){
    const k = KEG.find(x=>x.id==el.dataset.id);
    $('#modal').innerHTML = `<div class="ov" data-act="ovClose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h3 id="mt">Ubah jadwal kegiatan</h3><div class="sm">${esc(k.nama)} · saat ini ${rentang(k.m,k.s)}</div>
      <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <label class="f">Mulai<input type="date" id="rM" value="${k.m}"></label>
        <label class="f">Selesai<input type="date" id="rS" value="${k.s}"></label></div>
      <label class="f">Alasan perubahan<input id="rW" placeholder="mis. menyesuaikan jadwal narasumber"></label>
      <div class="acts" style="justify-content:flex-end"><button class="btn" data-act="mClose">Batal</button><button class="btn p" data-act="rSave" data-id="${k.id}">Simpan jadwal</button></div>
    </div></div>`;
  }
  if(a==='rSave'){
    const k = KEG.find(x=>x.id==el.dataset.id); const m = $('#rM').value, s = $('#rS').value;
    if(m && s && m<=s){ if(!k.resch) k.resch = rentang(k.m,k.s); k.m = m; k.s = s; state.cal = D(m).getMonth(); closeModal(); rerender(); toast('Jadwal diperbarui — keuangan & perencanaan ikut melihat perubahan'); }
    else toast('Tanggal tidak valid');
  }
  if(a==='mClose' || (a==='ovClose' && e.target===el)) closeModal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

route();
</script>
</body>
</html>
